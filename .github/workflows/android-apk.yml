name: Build standalone APK

on:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build standalone release APK
        run: |
          gradle -p android-native :app:assembleRelease --no-daemon
          cp android-native/app/build/outputs/apk/release/app-release.apk android-native/Tuerktok.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tuerktok-standalone-apk
          path: android-native/Tuerktok.apk
          if-no-files-found: error
